services:
  postgres:
    image: postgres:17-alpine 
    container_name: monitorSystem
    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    
    ports:
      - "${DB_PORT}:5432"
    
    volumes:
      - ./postgresData:/var/lib/postgresql/data
